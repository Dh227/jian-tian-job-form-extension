<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简填 · 网申资料助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="masthead">
        <div>
          <p class="eyebrow">简填 / JOB FORM</p>
          <h1>把资料带进这张表</h1>
        </div>
        <button id="openOptions" class="icon-button" type="button" aria-label="编辑个人资料">资料</button>
      </header>

      <section id="pageCard" class="page-card" aria-live="polite">
        <div class="site-line">
          <span id="siteMark" class="site-mark">—</span>
          <div class="site-copy">
            <strong id="siteName">正在读取当前页面</strong>
            <span id="siteUrl">请稍候</span>
          </div>
        </div>
        <span id="supportBadge" class="support-badge neutral">扫描中</span>
      </section>

      <section class="job-capture-card">
        <div><strong>看到合适岗位？</strong><span>保存公司、岗位、JD 和当前页截图</span></div>
        <button id="saveJobButton" class="capture-button" type="button">保存当前岗位</button>
      </section>

      <section class="metric-strip" aria-label="字段识别结果">
        <div><strong id="recognizedCount">0</strong><span>可填写</span></div>
        <div><strong id="confirmCount">0</strong><span>待确认</span></div>
        <div><strong id="missingCount">0</strong><span>资料缺失</span></div>
        <div><strong id="unsupportedCount">0</strong><span>未识别</span></div>
      </section>

      <section id="emptyProfile" class="notice hidden">
        <strong>先建立一份个人资料</strong>
        <p>资料只保存在当前浏览器中。填写一次，以后重复使用。</p>
        <button id="createProfile" class="secondary-button" type="button">开始填写资料</button>
      </section>

      <section id="previewSection" class="preview-section hidden">
        <div class="section-heading">
          <h2>本次填写预览</h2>
          <span id="previewCount">0 项</span>
        </div>
        <ul id="previewList" class="preview-list"></ul>
      </section>

      <section id="confirmSection" class="confirm-box hidden">
        <label>
          <input id="includeConfirmed" type="checkbox" />
          <span><strong>填写橙色标记字段</strong><small>这些字段匹配度较低或较敏感，请先核对预览。</small></span>
        </label>
      </section>

      <label class="overwrite-row">
        <input id="overwrite" type="checkbox" />
        <span>覆盖网页中已经填写的内容</span>
      </label>

      <div class="actions">
        <button id="fillButton" class="primary-button" type="button" disabled>一键填写</button>
        <button id="undoButton" class="secondary-button hidden" type="button">撤销</button>
      </div>

      <div id="resultMessage" class="result-message" aria-live="polite"></div>
      <footer>插件不会提交申请。填写后请逐项检查，再由你完成投递。</footer>
    </main>
    <script src="job-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
